<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escáner PRO</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: Arial;
  text-align: center;
  background: #111;
  color: white;
  margin: 0;
  padding: 20px;
}

#reader {
  width: 300px;
  margin: auto;
}

.card {
  padding: 20px;
  border-radius: 10px;
  margin-top: 10px;
  font-size: 20px;
}

.ok { background: green; }
.error { background: red; }
.duplicado { background: orange; }

#pantalla {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: none;
}

.verde { background: green; }
.rojo { background: red; }
.naranja { background: orange; }

.btn-camara {
  background: #4CAF50;
  color: white;
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 10px;
  margin: 20px 0;
  cursor: pointer;
}

.btn-camara:hover {
  background: #45a049;
}

.btn-camara:disabled {
  background: #666;
  cursor: not-allowed;
}
</style>
</head>

<body>

<h2>📷 FORO ASEZ WAO</h2>

<button id="btnCamara" class="btn-camara" onclick="iniciarCamara()">
  📷 Activar Cámara
</button>

<div id="reader"></div>

<div id="resultado" class="card">Esperando escaneo...</div>

<div id="pantalla"></div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbxh7YNrs3dyv7_xUDiZ4-M1yoovx-SQiY3geri6ibgq64ELuP7ce0ppsOtd69S0iIjlww/exec";

let qr = null;
let ultimoCodigo = "";
let escaneando = false;

function vibrar(tipo="ok") {
  if (!navigator.vibrate) return;
  navigator.vibrate(tipo === "ok" ? [100,50,100] : [300]);
}

function hablar(texto) {
  const msg = new SpeechSynthesisUtterance(texto);
  msg.lang = "es-ES";
  speechSynthesis.speak(msg);
}

function flash(color) {
  const pantalla = document.getElementById("pantalla");
  pantalla.className = color;
  pantalla.style.opacity = "0.6";

  setTimeout(() => pantalla.style.opacity = "0", 300);
}

function mostrar(data) {
  const div = document.getElementById("resultado");
  div.className = "card";

  if (data.status === "ok") {
    div.classList.add("ok");
    flash("verde");
    vibrar("ok");
    hablar("Registrado");

    div.innerHTML = `
      ✅ <b>${data.nombre}</b><br>
      🏢 ${data.area}
    `;
  }

  else if (data.status === "duplicado") {
    div.classList.add("duplicado");
    flash("naranja");
    vibrar("error");
    hablar("Ya registrado");

    div.innerHTML = `
      ⚠️ YA REGISTRADO<br>
      <b>${data.nombre}</b>
    `;
  }

  else {
    div.classList.add("error");
    flash("rojo");
    vibrar("error");
    hablar("Error");

    div.innerHTML = "❌ " + data.mensaje;
  }
}

function onScanSuccess(code) {
  if (escaneando) return;
  
  // 🔒 Evita repetir mismo QR
  if (code === ultimoCodigo) return;
  ultimoCodigo = code;
  escaneando = true;

  if (qr) qr.stop();

  fetch(URL, {
    method: "POST",
    body: JSON.stringify({ codigo: code })
  })
  .then(r => r.json())
  .then(d => mostrar(d))
  .catch(() => {
    document.getElementById("resultado").innerHTML = "❌ Error de conexión";
  })
  .finally(() => {
    setTimeout(() => {
      escaneando = false;
      if (qr) {
        qr.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          onScanSuccess
        );
      }
    }, 2000);
  });
}

// 🚀 Función para iniciar la cámara (activada por botón)
async function iniciarCamara() {
  const btn = document.getElementById("btnCamara");
  const resultado = document.getElementById("resultado");
  
  try {
    btn.disabled = true;
    btn.textContent = "🔄 Solicitando permisos...";
    resultado.innerHTML = "📷 Solicitando permiso de cámara...";

    // Verificar si el navegador soporta getUserMedia
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error("Tu navegador no soporta la cámara");
    }

    // Solicitar permisos primero
    await navigator.mediaDevices.getUserMedia({ video: true });
    
    btn.textContent = "🔄 Iniciando escáner...";
    resultado.innerHTML = "📷 Activando escáner...";

    // Crear instancia del escáner si no existe
    if (!qr) {
      qr = new Html5Qrcode("reader");
    }

    // Iniciar escáner
    await qr.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );

    btn.textContent = "✅ Cámara activa";
    btn.style.background = "#666";
    resultado.innerHTML = "📷 Escáner activo - Escanea un código QR";
    
  } catch (err) {
    console.error("Error:", err);
    btn.disabled = false;
    btn.textContent = "📷 Activar Cámara";
    btn.style.background = "#4CAF50";
    
    resultado.innerHTML = "❌ Error: " + err.message;
    
    // Mensaje de ayuda
    alert(
      "❌ No se pudo acceder a la cámara.\n\n" +
      "SOLUCIONES:\n" +
      "1. Usa Chrome o Edge\n" +
      "2. Haz clic en el candado 🔒 en la barra de direcciones\n" +
      "3. Permite el acceso a la cámara\n" +
      "4. Recarga la página y vuelve a intentar"
    );
  }
}

// ⚠️ NO iniciar automáticamente - esperar clic del usuario
console.log("📷 Presiona el botón para activar la cámara");
</script>

</body>
</html>

</body>
</html>
